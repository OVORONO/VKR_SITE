                    <div class="contact-cards">
                        <div class="contact-card">
                            <h3>Режим работы</h3>
                            <p>{{hours}}</p>
                        </div>

                        <div class="contact-card">
                            <h3>Телефон</h3>
                            <a href="tel:{{phoneHref}}">{{phone}}</a>
                        </div>

                        <div class="contact-card">
                            <h3>E-mail</h3>
                            <a href="mailto:{{email}}">{{email}}</a>
                        </div>

                        <div class="contact-card">
                            <h3>Адрес мастерской</h3>
                            <p>{{city}}, {{street}}</p>
                        </div>

{{#legalName}}                        <div class="contact-card contact-card-light">
                            <h3>Реквизиты продавца</h3>
                            <p>
                                {{legalName}}<br>
                                ИНН {{inn}}, {{ogrnLabel}} {{ogrn}}<br>
                                {{legalAddress}}
                            </p>
                        </div>
{{/legalName}}                    </div>
